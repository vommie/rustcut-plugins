[package]
name = "auto-rate"
description = "RustCut plugin: sets a rating when you assign a tag"
# Keep in step with plugin.toml (cargo xtask check compares them).
version = "1.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
# Built against the plugin API it declares in plugin.toml (api = "1.1"), so its builds run on RustCut 0.0.111 and newer;
# `cargo xtask check` compares both.
rustcut-plugin-api = { git = "https://github.com/vommie/rustcut.git", tag = "plugin-api-v1.1.0" }
serde.workspace = true

[dev-dependencies]
plugin-testkit.workspace = true
serde_json.workspace = true
