[package]
name = "auto-folder"
description = "RustCut plugin: sets the target folder from the folder the video comes from"
# Keep in step with plugin.toml (cargo xtask check compares them).
version = "1.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
rustcut-plugin-api.workspace = true
serde.workspace = true
regex.workspace = true

[dev-dependencies]
plugin-testkit.workspace = true
serde_json.workspace = true
