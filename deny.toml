# cargo deny check (run by cargo xtask check when cargo-deny is installed): licenses, sources, advisories.

[graph]
targets = ["x86_64-unknown-linux-gnu", "wasm32-wasip2"]

[licenses]
version = 2
confidence-threshold = 0.9
unused-allowed-license = "allow"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    # File-level copyleft, fine for an unmodified dependency (option-ext, pulled in by RustCut's host for the tests).
    "MPL-2.0",
    "0BSD",
    "Unlicense",
    "BSL-1.0",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# RustCut's repository: the plugin API and the plugin host of the tests.
allow-git = ["ssh://git@github.com/vommie/rustcut.git"]

[advisories]
version = 2
