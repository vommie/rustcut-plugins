[workspace]
resolver = "3"
members = ["plugins/*", "crates/plugin-testkit", "xtask"]
# `cargo build` and `cargo test` cover the plugins; the tools build when they run.
default-members = ["plugins/*"]

[workspace.package]
edition = "2024"
rust-version = "1.97"
license = "MIT"
authors = ["vommie"]
repository = "https://github.com/vommie/rustcut-plugins"
publish = false

[workspace.dependencies]
# The plugin API of RustCut, pinned to a tag of RustCut's repository (plugin-api-vMAJOR.MINOR.PATCH).
rustcut-plugin-api = { git = "https://github.com/vommie/rustcut.git", tag = "plugin-api-v1.0.0" }
# RustCut's real plugin host, for the tests that run a built plugin (plugin-testkit only).
rustcut-plugin-host = { git = "https://github.com/vommie/rustcut.git", tag = "plugin-api-v1.0.0" }
plugin-testkit = { path = "crates/plugin-testkit" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = { version = "1", default-features = false, features = ["std", "unicode-perl"] }
semver = "1"
toml = "1"
clap = { version = "4", features = ["derive"] }
sha2 = "0.11"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
non_ascii_idents = "forbid"
unused_qualifications = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
indexing_slicing = "warn"
string_slice = "warn"
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_sign_loss = "warn"
map_err_ignore = "warn"
redundant_clone = "warn"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
doc_markdown = "allow"
needless_pass_by_value = "allow"
assert_is_empty = "allow"  # tests: `assert!(x.is_empty())` reads fine

[profile.release]
# Plugins are small and start fast; size over speed is right for event handlers.
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
